name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check .
      - name: Test
        run: uv run --python 3.12 --group dev pytest -q

  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Scripted quarter, every incident resolved with a complete timeline
        run: uv run --python 3.12 incidentbot simulate --check --out sim-out
      - name: Results match the committed sample
        run: |
          python3 - <<'PY'
          import json
          got = json.load(open("sim-out/sim-results.json"))
          want = json.load(open("docs/sim-results.json"))
          assert got["total"] == 20, got["total"]
          assert got["open"] == 0, got["open"]
          assert got["overall"] == want["overall"], "simulation drifted from docs/sim-results.json"
          print("simulation matches docs/sim-results.json")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: simulation
          path: sim-out/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: incidentbot:ci
      - name: Smoke test the image
        run: |
          docker run -d --name bot -p 8850:8850 incidentbot:ci
          for i in $(seq 1 60); do curl -sf localhost:8850/healthz | grep -q '"ok"' && break; sleep 1; done
          curl -sf localhost:8850/healthz
          curl -sf localhost:8850/metrics | grep incidentbot_open_incidents
          curl -sf localhost:8850/api/incidents | grep -q INC-1021
          docker inspect --format '{{.State.Health.Status}}' bot
          docker rm -f bot
